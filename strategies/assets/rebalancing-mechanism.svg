<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 16px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
      .zone-up { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 10px; }
      .zone-base { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 10px; }
      .zone-down { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; rx: 10px; }
      .label-band { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; font-size: 16px; font-weight: 800; }
      .label-rule { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .label-action { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; font-size: 12.5px; fill: #475569; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <rect x="2" y="2" width="796" height="316" class="bg"/>
  <text x="32" y="42" class="title">±10%p 밴드 리밸런싱 메커니즘 (정기 점검일 기준)</text>

  <!-- 80% Upper Band (상승장 익절) -->
  <g transform="translate(32, 65)">
    <rect x="0" y="0" width="736" height="68" class="zone-up"/>
    <text x="24" y="40" class="label-band" fill="#dc2626">비중 80% 도달</text>
    <text x="170" y="30" class="label-rule">[상승 과열] 레버리지 일부 매도 ➔ 배당주 매수</text>
    <text x="170" y="52" class="label-action">• 너무 커진 레버리지 수익을 확정(익절)하고 배당주 주수를 늘려 70:30으로 복구</text>
  </g>

  <!-- 70% Baseline (평상시) -->
  <g transform="translate(32, 145)">
    <rect x="0" y="0" width="736" height="52" class="zone-base"/>
    <text x="24" y="32" class="label-band" fill="#1d4ed8">비중 70% 기준</text>
    <text x="170" y="32" class="label-rule">[평상시 적립] 월급 + 배당금으로 '부족한 쪽'만 추가 매수하여 70:30 유지</text>
  </g>

  <!-- 60% Lower Band (하락장 저가매수) -->
  <g transform="translate(32, 209)">
    <rect x="0" y="0" width="736" height="68" class="zone-down"/>
    <text x="24" y="40" class="label-band" fill="#16a34a">비중 60% 도달</text>
    <text x="170" y="30" class="label-rule">[시장 폭락] 배당주 일부 매도 ➔ 레버리지 추가 매수</text>
    <text x="170" y="52" class="label-action">• 덜 떨어진 배당주를 매도해 바닥에 떨어진 레버리지 평단을 대폭 낮춰 70:30으로 복구</text>
  </g>
</svg>
