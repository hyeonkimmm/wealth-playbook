<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 16px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; font-size: 12px; fill: #64748b; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
      .bar-cagr { fill: #2563eb; rx: 4px; }
      .bar-cagr-highlight { fill: #1d4ed8; rx: 4px; }
      .bar-mdd { fill: #ef4444; rx: 4px; }
      .val-label { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; font-size: 11.5px; fill: #475569; }
    </style>
  </defs>

  <rect x="2" y="2" width="796" height="366" class="bg"/>
  <text x="32" y="38" class="title">전략 비중별(5:5 ~ 9:1) 14년간(2012~2025) 실전 백테스트 비교</text>
  <text x="32" y="58" class="subtitle">QLD(2배 레버리지) : SCHD(배당) 비중별 연평균 성장률(CAGR) vs 2022년 하락장 최대낙폭(MDD)</text>

  <!-- Legend -->
  <g transform="translate(480, 26)">
    <rect x="0" y="0" width="14" height="14" fill="#2563eb" rx="3"/>
    <text x="20" y="11" class="legend-text">연평균 성장률 (CAGR)</text>
    <rect x="150" y="0" width="14" height="14" fill="#ef4444" rx="3"/>
    <text x="170" y="11" class="legend-text">2022 하락장 MDD</text>
  </g>

  <!-- Zero Line -->
  <line x1="40" y1="210" x2="760" y2="210" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 5:5 -->
  <g transform="translate(105, 0)">
    
    <rect x="-30" y="113.59967838719024" width="28" height="96.40032161280976" class="bar-cagr" fill="#cbd5e1"/>
    <text x="-16" y="105.59967838719024" class="val-label">+24.1%</text>
    <rect x="2" y="210" width="28" height="48.60897040546904" class="bar-mdd" fill="#ef4444"/>
    <text x="16" y="274.60897040546905" class="val-label" fill="#dc2626">-40.5%</text>
    <text x="0" y="328" class="axis-label">5:5 (절반)</text>
  </g>

  <!-- 6:4 -->
  <g transform="translate(250, 0)">
    
    <rect x="-30" y="106.90024754792984" width="28" height="103.09975245207016" class="bar-cagr" fill="#94a3b8"/>
    <text x="-16" y="98.90024754792984" class="val-label">+25.8%</text>
    <rect x="2" y="210" width="28" height="56.05544306673323" class="bar-mdd" fill="#ef4444"/>
    <text x="16" y="282.05544306673323" class="val-label" fill="#dc2626">-46.7%</text>
    <text x="0" y="328" class="axis-label">6:4 (보수)</text>
  </g>

  <!-- 7:3 -->
  <g transform="translate(395, 0)">
    <rect x="-46" y="70" width="92" height="248" fill="#eff6ff" rx="8" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3,3"/>
    <rect x="-30" y="96.00163082497411" width="28" height="113.99836917502589" class="bar-cagr-highlight"/>
    <text x="-16" y="88.00163082497411" class="val-label" fill="#1d4ed8" font-size="13px">+28.5%</text>
    <rect x="2" y="210" width="28" height="59.081710710346876" class="bar-mdd" fill="#f87171"/>
    <text x="16" y="285.0817107103469" class="val-label" fill="#dc2626">-49.2%</text>
    <text x="0" y="338" class="axis-label" fill="#1d4ed8">★ 7:3 (표준)</text>
  </g>

  <!-- 8:2 -->
  <g transform="translate(540, 0)">
    
    <rect x="-30" y="90.17168163454649" width="28" height="119.82831836545351" class="bar-cagr" fill="#93c5fd"/>
    <text x="-16" y="82.17168163454649" class="val-label">+30.0%</text>
    <rect x="2" y="210" width="28" height="66.64714879031735" class="bar-mdd" fill="#ef4444"/>
    <text x="16" y="292.6471487903174" class="val-label" fill="#dc2626">-55.5%</text>
    <text x="0" y="328" class="axis-label">8:2 (공격)</text>
  </g>

  <!-- 9:1 -->
  <g transform="translate(685, 0)">
    
    <rect x="-30" y="80.66966642556088" width="28" height="129.33033357443912" class="bar-cagr" fill="#93c5fd"/>
    <text x="-16" y="72.66966642556088" class="val-label">+32.3%</text>
    <rect x="2" y="210" width="28" height="74.77600580530871" class="bar-mdd" fill="#ef4444"/>
    <text x="16" y="300.7760058053087" class="val-label" fill="#dc2626">-62.3%</text>
    <text x="0" y="328" class="axis-label">9:1 (초공격)</text>
  </g>
</svg>