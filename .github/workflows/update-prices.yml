name: Update ETF Market Prices

on:
  schedule:
    # 월~금 한국시간 15:40 KST (UTC 06:40) 장 마감 직후 자동 실행
    - cron: '40 6 * * 1-5'
  workflow_dispatch: # 수동 실행 지원

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytz

      - name: Fetch latest ETF market prices
        run: python scripts/update_prices.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/latest-prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update ETF market prices [skip ci]" && git push)
