          '        <button type="button" id="' + idPrefix + 'btn_undo_sim" style="display: none; flex: 1; min-width: 200px; padding: 10px 14px; font-size: 13px; font-weight: 700; color: #334155; background: #f1f5f9; border: 1.5px solid #cbd5e1; border-radius: 8px; cursor: pointer; transition: background 0.15s;">이전 수량으로 되돌리기 (실행 취소)</button>',
          '      </div>',
          '    </div>',
          '  </div>',
          '</div>'
        ].join('\n');

        target.innerHTML = html;

        var backupState = null;
        var currentTradePlan = { sellQ: 0, sellS: 0, buyQ: 0, buyS: 0, remCash: 0, hasTrades: false };

        function fmt(n) { return Math.round(n).toLocaleString() + '원'; }

        function calculate() {
          var cash = Math.max(0, parseFloat(document.getElementById(idPrefix + 'cash').value) || 0);
          var targetRatio = parseFloat(document.getElementById(idPrefix + 'ratio').value) || 0.7;
          var band = parseFloat(document.getElementById(idPrefix + 'band').value) || 0.10;
          var qldQty = Math.max(0, parseFloat(document.getElementById(idPrefix + 'qld_qty').value) || 0);
          var qldPrice = Math.max(0, parseFloat(document.getElementById(idPrefix + 'qld_price').value) || 0);
          var schdQty = Math.max(0, parseFloat(document.getElementById(idPrefix + 'schd_qty').value) || 0);
          var schdPrice = Math.max(0, parseFloat(document.getElementById(idPrefix + 'schd_price').value) || 0);

          var card = document.getElementById(idPrefix + 'action_card');
          var badge = document.getElementById(idPrefix + 'status_badge');
          var title = document.getElementById(idPrefix + 'status_title');
          var detail = document.getElementById(idPrefix + 'action_detail');
          var after = document.getElementById(idPrefix + 'after_sim');

          // 가격 유효성 검사
          if (qldPrice <= 0 || schdPrice <= 0) {
            badge.style.background = '#fef3c7';
            badge.style.color = '#b45309';
            card.style.borderLeftColor = '#f59e0b';
            badge.innerText = '입력 대기';
            title.innerText = '올바른 ETF 현재가를 입력해주세요';
            detail.innerHTML = '현재가가 0원 이하인 경우 정확한 비중과 매수 수량을 계산할 수 없습니다.';
            after.innerText = '';
            return;
          }

          var qldVal = qldQty * qldPrice;
          var schdVal = schdQty * schdPrice;
          var totalStock = qldVal + schdVal;
          var totalAll = totalStock + cash;

          document.getElementById(idPrefix + 'qld_eval').innerText = fmt(qldVal);
          document.getElementById(idPrefix + 'schd_eval').innerText = fmt(schdVal);
          document.getElementById(idPrefix + 'total_val').innerText = fmt(totalAll);

          var targetPctStr = Math.round(targetRatio * 100) + ':' + Math.round((1 - targetRatio) * 100);

          // 시나리오 0: 보유 주식이 전혀 없는 초기 시작 (신규 진입)
          if (totalStock === 0) {
            document.getElementById(idPrefix + 'bar_qld').style.width = (targetRatio * 100) + '%';
            document.getElementById(idPrefix + 'bar_qld').innerText = 'QLD 0% (목표 ' + Math.round(targetRatio * 100) + '%)';
            document.getElementById(idPrefix + 'bar_schd').style.width = ((1 - targetRatio) * 100) + '%';
            document.getElementById(idPrefix + 'bar_schd').innerText = 'SCHD 0% (목표 ' + Math.round((1 - targetRatio) * 100) + '%)';

            card.style.borderLeftColor = '#2563eb';
            badge.style.background = '#dbeafe';
            badge.style.color = '#1d4ed8';
            badge.innerText = '신규 포트폴리오 구축 (' + targetPctStr + ')';
            title.innerText = '보유 주식이 없습니다. 이번 달 적립금으로 초기 비중을 맞추어 매수하세요';

            if (cash <= 0) {
              detail.innerHTML = '투자 가능 금액(적립금)을 1원 이상 입력해주세요.';
              after.innerText = '매수 후 예상 비중: -';
              currentTradePlan = { sellQ: 0, sellS: 0, buyQ: 0, buyS: 0, remCash: 0, hasTrades: false };
              updateSimButtons();
              return;
            }

            var initQldCash = cash * targetRatio;
            var initSchdCash = cash * (1 - targetRatio);
            var buyQ = Math.floor(initQldCash / qldPrice);
            var buyS = Math.floor(initSchdCash / schdPrice);
            var spent = (buyQ * qldPrice) + (buyS * schdPrice);
            var leftover = cash - spent;

            detail.innerHTML = '• <strong>TIGER 미국나스닥100레버리지:</strong> <span style="color:#2563eb; font-size:15px;">' + buyQ.toLocaleString() + '주</span> 매수 (' + fmt(buyQ * qldPrice) + ')<br>' +
                               '• <strong>TIGER 미국배당다우존스:</strong> <span style="color:#16a34a; font-size:15px;">' + buyS.toLocaleString() + '주</span> 매수 (' + fmt(buyS * schdPrice) + ')' +
                               (leftover > 0 ? '<br><span style="font-size:12px; color:#64748b;">(매수 후 잔여 예수금: ' + fmt(leftover) + ')</span>' : '');
            var finalQ = buyQ * qldPrice;
            var finalS = buyS * schdPrice;
            var finalTot = finalQ + finalS;
            if (finalTot > 0) {
              after.innerText = '매수 후 예상 비중: QLD ' + ((finalQ / finalTot) * 100).toFixed(1) + '% : SCHD ' + ((finalS / finalTot) * 100).toFixed(1) + '% (' + targetPctStr + ' 초기 세팅 완료)';
            } else {
              after.innerText = '적립금이 주가보다 작아 1주 이상 매수할 수 없습니다.';
            }
            currentTradePlan = { sellQ: 0, sellS: 0, buyQ: buyQ, buyS: buyS, remCash: leftover, hasTrades: (buyQ > 0 || buyS > 0) };
            updateSimButtons();
            return;
          }

          var curQldPct = qldVal / totalStock;
          var curSchdPct = schdVal / totalStock;
          var barW = Math.max(12, Math.min(88, curQldPct * 100));

          document.getElementById(idPrefix + 'bar_qld').style.width = barW + '%';
          document.getElementById(idPrefix + 'bar_qld').innerText = 'QLD ' + (curQldPct * 100).toFixed(1) + '%';
          document.getElementById(idPrefix + 'bar_schd').style.width = (100 - barW) + '%';
          document.getElementById(idPrefix + 'bar_schd').innerText = 'SCHD ' + (curSchdPct * 100).toFixed(1) + '%';

          var upper = targetRatio + band;
          var lower = targetRatio - band;
          var targetQldVal = totalAll * targetRatio;
          var targetSchdVal = totalAll * (1 - targetRatio);

          // Case 1: 레버리지 비중 초과 (QLD 비중 >= 상한선, e.g. 80%)
          if (curQldPct >= upper) {
            // 하위 조건 1A: 적립금이 워낙 커서 매도 없이 적립금만으로 목표 비중 복구가 가능한 경우
            if (qldVal <= targetQldVal) {
              card.style.borderLeftColor = '#2563eb';
              badge.style.background = '#dbeafe';
              badge.style.color = '#1d4ed8';
              badge.innerText = '스마트 적립 (매도 불필요)';
              title.innerText = '레버리지 비중이 상한선을 초과했으나, 당월 적립금만으로 목표 비율 복구가 가능합니다';

              var defQ = Math.max(0, targetQldVal - qldVal);
              var defS = Math.max(0, targetSchdVal - schdVal);
              var allocQ = 0, allocS = 0;
              if (defQ > 0 && defS > 0) {
                allocQ = defQ;
                allocS = defS;
              } else {
                allocQ = 0;
                allocS = cash;
              }
              var bQ = Math.floor(allocQ / qldPrice);
              var bS = Math.floor(allocS / schdPrice);
              var rem = cash - ((bQ * qldPrice) + (bS * schdPrice));
              if (rem >= schdPrice) {
                bS += Math.floor(rem / schdPrice);
                rem = cash - ((bQ * qldPrice) + (bS * schdPrice));
              }
              if (rem >= qldPrice && defQ >= defS) {
                bQ += Math.floor(rem / qldPrice);
                rem = cash - ((bQ * qldPrice) + (bS * schdPrice));
              }

              if (bQ > 0 && bS > 0) {
                detail.innerHTML = '기존 주식 매도 없이, 이번 달 적립금으로 비중을 맞추기 위해 양쪽 종목을 배분 매수하세요:<br>' +
                                   '• <strong>TIGER 미국배당다우존스:</strong> <span style="color:#16a34a; font-size:15px;">' + bS.toLocaleString() + '주</span> 매수 (' + fmt(bS * schdPrice) + ')<br>' +
                                   '• <strong>TIGER 미국나스닥100레버리지:</strong> <span style="color:#2563eb; font-size:15px;">' + bQ.toLocaleString() + '주</span> 매수 (' + fmt(bQ * qldPrice) + ')' +
                                   (rem > 0 ? '<br><span style="font-size:12px; color:#64748b;">(매수 후 잔여 예수금: ' + fmt(rem) + ')</span>' : '');
              } else {
                detail.innerHTML = '기존 주식 매도 없이, 이번 달 적립금 전액으로 <strong>TIGER 미국배당다우존스</strong>만 <span style="color:#16a34a; font-size:15px;">' + bS.toLocaleString() + '주</span> (' + fmt(bS * schdPrice) + ') 집중 매수하세요.' +
                                   (rem > 0 ? '<br><span style="font-size:12px; color:#64748b;">(매수 후 잔여 예수금: ' + fmt(rem) + ')</span>' : '');
              }
              var nQ = qldVal + (bQ * qldPrice);
              var nS = schdVal + (bS * schdPrice);
              after.innerText = '매수 후 예상 비중: QLD ' + ((nQ / (nQ + nS)) * 100).toFixed(1) + '% : SCHD ' + ((nS / (nQ + nS)) * 100).toFixed(1) + '% (목표 비율 ' + targetPctStr + ' 복구 완료)';
              currentTradePlan = { sellQ: 0, sellS: 0, buyQ: bQ, buyS: bS, remCash: rem, hasTrades: (bQ > 0 || bS > 0) };
            } else {
              // 하위 조건 1B: 진정한 스위칭 필요 (QLD 매도 -> SCHD 매수)
              card.style.borderLeftColor = '#dc2626';
              badge.style.background = '#fee2e2';
              badge.style.color = '#b91c1c';
              badge.innerText = '레버리지 비중 초과 (스위칭 트리거)';
              title.innerText = '레버리지 비중 상한 초과: 초과분을 매도하여 배당주로 리밸런싱하세요';

              var excessQld = qldVal - targetQldVal;
              var sellQldShares = Math.min(qldQty, Math.max(1, Math.floor(excessQld / qldPrice)));
              var proceeds = sellQldShares * qldPrice;
              var totalAvailable = proceeds + cash;
              var buySchdShares = Math.floor(totalAvailable / schdPrice);
              var rem = totalAvailable - (buySchdShares * schdPrice);

              detail.innerHTML = '1. <strong>TIGER 미국나스닥100레버리지</strong>를 <span style="color:#dc2626; font-size:15px;">' + sellQldShares.toLocaleString() + '주</span> 매도하여 약 ' + fmt(proceeds) + ' 현금 확보<br>' +
                                 '2. 매도 대금' + (cash > 0 ? ' + 당월 적립금' : '') + '으로 <strong>TIGER 미국배당다우존스</strong>를 <span style="color:#16a34a; font-size:15px;">' + buySchdShares.toLocaleString() + '주</span> 매수' +
                                 (rem > 0 ? '<br><span style="font-size:12px; color:#64748b;">(스위칭 후 잔여 예수금: ' + fmt(rem) + ')</span>' : '');
              var nQ = qldVal - proceeds;
              var nS = schdVal + (buySchdShares * schdPrice);
              after.innerText = '스위칭 후 예상 비중: QLD ' + ((nQ / (nQ + nS)) * 100).toFixed(1) + '% : SCHD ' + ((nS / (nQ + nS)) * 100).toFixed(1) + '% (목표 비율 ' + targetPctStr + ' 복구 완료)';
              currentTradePlan = { sellQ: sellQldShares, sellS: 0, buyQ: 0, buyS: buySchdShares, remCash: rem, hasTrades: true };
            }
          }
          // Case 2: 레버리지 비중 부족 (QLD 비중 <= 하한선, e.g. 60%)
          else if (curQldPct <= lower) {
            // 하위 조건 2A: 적립금만으로 QLD를 매수해도 목표 비중 복구가 가능한 경우
            if (schdVal <= targetSchdVal) {
              card.style.borderLeftColor = '#16a34a';
              badge.style.background = '#dcfce7';
              badge.style.color = '#15803d';
              badge.innerText = '스마트 적립 (매도 불필요)';
              title.innerText = '레버리지 비중이 하한선에 미달했으나, 당월 적립금만으로 목표 비율 복구가 가능합니다';

              var defQ = Math.max(0, targetQldVal - qldVal);
              var defS = Math.max(0, targetSchdVal - schdVal);
              var allocQ = 0, allocS = 0;
              if (defQ > 0 && defS > 0) {
                allocQ = defQ;
                allocS = defS;
              } else {
                allocQ = cash;
                allocS = 0;
              }
              var bQ = Math.floor(allocQ / qldPrice);
              var bS = Math.floor(allocS / schdPrice);
              var rem = cash - ((bQ * qldPrice) + (bS * schdPrice));
              if (rem >= qldPrice) {
                bQ += Math.floor(rem / qldPrice);
                rem = cash - ((bQ * qldPrice) + (bS * schdPrice));
              }
              if (rem >= schdPrice && defS >= defQ) {
                bS += Math.floor(rem / schdPrice);
                rem = cash - ((bQ * qldPrice) + (bS * schdPrice));
              }

              if (bQ > 0 && bS > 0) {
                detail.innerHTML = '기존 주식 매도 없이, 이번 달 적립금으로 비중을 맞추기 위해 양쪽 종목을 배분 매수하세요:<br>' +
                                   '• <strong>TIGER 미국나스닥100레버리지:</strong> <span style="color:#2563eb; font-size:15px;">' + bQ.toLocaleString() + '주</span> 매수 (' + fmt(bQ * qldPrice) + ')<br>' +
                                   '• <strong>TIGER 미국배당다우존스:</strong> <span style="color:#16a34a; font-size:15px;">' + bS.toLocaleString() + '주</span> 매수 (' + fmt(bS * schdPrice) + ')' +
                                   (rem > 0 ? '<br><span style="font-size:12px; color:#64748b;">(매수 후 잔여 예수금: ' + fmt(rem) + ')</span>' : '');
              } else {
                detail.innerHTML = '기존 주식 매도 없이, 이번 달 적립금 전액으로 <strong>TIGER 미국나스닥100레버리지</strong>만 <span style="color:#2563eb; font-size:15px;">' + bQ.toLocaleString() + '주</span> (' + fmt(bQ * qldPrice) + ') 집중 매수하세요.' +
                                   (rem > 0 ? '<br><span style="font-size:12px; color:#64748b;">(매수 후 잔여 예수금: ' + fmt(rem) + ')</span>' : '');
              }
              var nQ = qldVal + (bQ * qldPrice);
              var nS = schdVal + (bS * schdPrice);
              after.innerText = '매수 후 예상 비중: QLD ' + ((nQ / (nQ + nS)) * 100).toFixed(1) + '% : SCHD ' + ((nS / (nQ + nS)) * 100).toFixed(1) + '% (목표 비율 ' + targetPctStr + ' 복구 완료)';
              currentTradePlan = { sellQ: 0, sellS: 0, buyQ: bQ, buyS: bS, remCash: rem, hasTrades: (bQ > 0 || bS > 0) };
            } else {
              // 하위 조건 2B: 진정한 스위칭 필요 (SCHD 매도 -> QLD 매수)
              card.style.borderLeftColor = '#16a34a';
              badge.style.background = '#dcfce7';
              badge.style.color = '#15803d';
              badge.innerText = '레버리지 비중 부족 (스위칭 트리거)';
              title.innerText = '레버리지 비중 하한 미달: 배당주 일부를 매도하여 레버리지로 리밸런싱하세요';

              var excessSchd = schdVal - targetSchdVal;
              var sellSchdShares = Math.min(schdQty, Math.max(1, Math.floor(excessSchd / schdPrice)));
              var proceeds = sellSchdShares * schdPrice;
              var totalAvailable = proceeds + cash;
              var buyQldShares = Math.floor(totalAvailable / qldPrice);
              var rem = totalAvailable - (buyQldShares * qldPrice);

              detail.innerHTML = '1. <strong>TIGER 미국배당다우존스</strong>를 <span style="color:#dc2626; font-size:15px;">' + sellSchdShares.toLocaleString() + '주</span> 매도하여 약 ' + fmt(proceeds) + ' 현금 확보<br>' +
                                 '2. 매도 대금' + (cash > 0 ? ' + 당월 적립금' : '') + '으로 <strong>TIGER 미국나스닥100레버리지</strong>를 <span style="color:#2563eb; font-size:15px;">' + buyQldShares.toLocaleString() + '주</span> 매수' +
                                 (rem > 0 ? '<br><span style="font-size:12px; color:#64748b;">(스위칭 후 잔여 예수금: ' + fmt(rem) + ')</span>' : '');
              var nQ = qldVal + (buyQldShares * qldPrice);
              var nS = schdVal - proceeds;
              after.innerText = '스위칭 후 예상 비중: QLD ' + ((nQ / (nQ + nS)) * 100).toFixed(1) + '% : SCHD ' + ((nS / (nQ + nS)) * 100).toFixed(1) + '% (목표 비율 ' + targetPctStr + ' 복구 완료)';
              currentTradePlan = { sellQ: 0, sellS: sellSchdShares, buyQ: buyQldShares, buyS: 0, remCash: rem, hasTrades: true };
            }
          }
          // Case 3: 정상 범위 (스마트 적립)
          else {
            card.style.borderLeftColor = '#2563eb';
            badge.style.background = '#dbeafe';
            badge.style.color = '#1d4ed8';
            badge.innerText = '정상 밴드 내 (스마트 적립)';
            title.innerText = '기존 주식 매도 없이, 이번 달 적립금으로 부족한 종목만 채워 넣으세요';

            if (cash <= 0) {
              detail.innerHTML = '현재 비중이 정상 밴드 내에 있으며, 당월 적립금이 없으므로 이번 달에는 아무런 조치가 필요하지 않습니다.';
              after.innerText = '현재 비중 유지: QLD ' + (curQldPct * 100).toFixed(1) + '% : SCHD ' + (curSchdPct * 100).toFixed(1) + '%';
              currentTradePlan = { sellQ: 0, sellS: 0, buyQ: 0, buyS: 0, remCash: 0, hasTrades: false };
              updateSimButtons();
              return;
            }

            var defQld = Math.max(0, targetQldVal - qldVal);
            var defSchd = Math.max(0, targetSchdVal - schdVal);
            var allocQ = 0, allocS = 0;

            if (defQld > 0 && defSchd > 0) {
              allocQ = defQld;
              allocS = defSchd;
            } else if (defQld > 0) {
              allocQ = cash;
              allocS = 0;
            } else if (defSchd > 0) {
              allocQ = 0;
              allocS = cash;
            } else {
              allocQ = cash * targetRatio;
              allocS = cash * (1 - targetRatio);
            }

            var bQ = Math.floor(allocQ / qldPrice);
            var bS = Math.floor(allocS / schdPrice);

            // 잔여 현금으로 부족한 자산 추가 1주 매수 시도
            var rem = cash - ((bQ * qldPrice) + (bS * schdPrice));
            if (rem >= qldPrice && defQld >= defSchd) {
              bQ += Math.floor(rem / qldPrice);
              rem = cash - ((bQ * qldPrice) + (bS * schdPrice));
            }
            if (rem >= schdPrice) {
              bS += Math.floor(rem / schdPrice);
              rem = cash - ((bQ * qldPrice) + (bS * schdPrice));
            }

            if (bQ > 0 && bS > 0) {
              detail.innerHTML = '• <strong>TIGER 미국나스닥100레버리지:</strong> <span style="color:#2563eb; font-size:15px;">' + bQ.toLocaleString() + '주</span> 매수 (' + fmt(bQ * qldPrice) + ')<br>' +
                                 '• <strong>TIGER 미국배당다우존스:</strong> <span style="color:#16a34a; font-size:15px;">' + bS.toLocaleString() + '주</span> 매수 (' + fmt(bS * schdPrice) + ')' +
                                 (rem > 0 ? '<br><span style="font-size:12px; color:#64748b;">(매수 후 잔여 예수금: ' + fmt(rem) + ')</span>' : '');
            } else if (bQ > 0) {
              detail.innerHTML = '이번 달 적립금으로 <strong>TIGER 미국나스닥100레버리지</strong>만 <span style="color:#2563eb; font-size:15px;">' + bQ.toLocaleString() + '주</span> (' + fmt(bQ * qldPrice) + ') 집중 매수하세요.' +
                                 (rem > 0 ? '<br><span style="font-size:12px; color:#64748b;">(매수 후 잔여 예수금: ' + fmt(rem) + ')</span>' : '');
            } else if (bS > 0) {
              detail.innerHTML = '이번 달 적립금으로 <strong>TIGER 미국배당다우존스</strong>만 <span style="color:#16a34a; font-size:15px;">' + bS.toLocaleString() + '주</span> (' + fmt(bS * schdPrice) + ') 집중 매수하세요.' +
                                 (rem > 0 ? '<br><span style="font-size:12px; color:#64748b;">(매수 후 잔여 예수금: ' + fmt(rem) + ')</span>' : '');
            } else {
              detail.innerHTML = '적립금(' + fmt(cash) + ')이 주가보다 작아 1주 이상 매수할 수 없습니다. 적립금을 계좌 예수금으로 이월하세요.';
            }
            var nQ = qldVal + (bQ * qldPrice);
            var nS = schdVal + (bS * schdPrice);
            var nTot = nQ + nS;
            if (nTot > 0) {
              after.innerText = '매수 후 예상 비중: QLD ' + ((nQ / nTot) * 100).toFixed(1) + '% : SCHD ' + ((nS / nTot) * 100).toFixed(1) + '% (' + targetPctStr + ' 복구 완료)';
            }
            currentTradePlan = { sellQ: 0, sellS: 0, buyQ: bQ, buyS: bS, remCash: rem, hasTrades: (bQ > 0 || bS > 0) };
          }

          updateSimButtons();
        }

        function updateSimButtons() {
          var btnApply = document.getElementById(idPrefix + 'btn_apply_sim');
          var btnUndo = document.getElementById(idPrefix + 'btn_undo_sim');
          var simBanner = document.getElementById(idPrefix + 'sim_banner');

          if (!btnApply || !btnUndo || !simBanner) return;

          if (backupState !== null) {
            btnApply.style.display = 'none';
            btnUndo.style.display = 'flex';
            simBanner.style.display = 'block';
          } else if (currentTradePlan.hasTrades) {
            btnApply.style.display = 'flex';
            btnUndo.style.display = 'none';
            simBanner.style.display = 'none';
          } else {
            btnApply.style.display = 'none';
            btnUndo.style.display = 'none';
            simBanner.style.display = 'none';
          }
        }

        ['cash', 'ratio', 'band', 'qld_qty', 'qld_price', 'schd_qty', 'schd_price'].forEach(function(key) {
          var el = document.getElementById(idPrefix + key);
          if (el) {
            el.addEventListener('input', function() {
              backupState = null;
              calculate();
            });
            el.addEventListener('change', function() {
              backupState = null;
              calculate();
            });
          }
        });

        var btnApply = document.getElementById(idPrefix + 'btn_apply_sim');
        var btnUndo = document.getElementById(idPrefix + 'btn_undo_sim');

        if (btnApply) {
          btnApply.addEventListener('click', function(e) {
            e.preventDefault();
            if (!currentTradePlan.hasTrades) return;
            backupState = {
              qld_qty: document.getElementById(idPrefix + 'qld_qty').value,
              schd_qty: document.getElementById(idPrefix + 'schd_qty').value,
              cash: document.getElementById(idPrefix + 'cash').value
            };
            var curQ = parseFloat(backupState.qld_qty) || 0;
            var curS = parseFloat(backupState.schd_qty) || 0;
            var nQ = Math.max(0, curQ - currentTradePlan.sellQ + currentTradePlan.buyQ);
            var nS = Math.max(0, curS - currentTradePlan.sellS + currentTradePlan.buyS);
            var nC = Math.max(0, Math.round(currentTradePlan.remCash));

            document.getElementById(idPrefix + 'qld_qty').value = nQ;
            document.getElementById(idPrefix + 'schd_qty').value = nS;
            document.getElementById(idPrefix + 'cash').value = nC;

            calculate();
          });
        }

        if (btnUndo) {
          btnUndo.addEventListener('click', function(e) {
            e.preventDefault();
            if (backupState) {
              document.getElementById(idPrefix + 'qld_qty').value = backupState.qld_qty;
              document.getElementById(idPrefix + 'schd_qty').value = backupState.schd_qty;
              document.getElementById(idPrefix + 'cash').value = backupState.cash;
              backupState = null;
              calculate();
            }
          });
        }

        var cashInput = document.getElementById(idPrefix + 'cash');
        target.querySelectorAll('.btn-cash-quick').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            var addVal = parseFloat(btn.getAttribute('data-add')) || 0;
            var cur = parseFloat(cashInput.value) || 0;
            cashInput.value = cur + addVal;
            backupState = null;
            calculate();
          });
        });

        target.querySelectorAll('.btn-cash-reset').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            cashInput.value = 0;
            backupState = null;
            calculate();
          });
        });

        function loadLatestPrices() {
          var syncBadge = document.getElementById(idPrefix + 'price_sync_badge');
          fetch('assets/data/latest-prices.json?v=' + Date.now())
            .then(function(res) {
              if (!res.ok) throw new Error('Network response was not ok');
              return res.json();
            })
            .then(function(data) {
              if (data && data.prices) {
                var pQld = data.prices['418660'];
                var pSchd = data.prices['458730'];
                if (pQld && pQld.price) {
                  document.getElementById(idPrefix + 'qld_price').value = pQld.price;
                }
                if (pSchd && pSchd.price) {
                  document.getElementById(idPrefix + 'schd_price').value = pSchd.price;
                }
                if (syncBadge && data.updated_at) {
                  syncBadge.innerHTML = '최근 시장 종가 연동 완료 (' + data.updated_at + ')';
                  syncBadge.style.color = '#16a34a';
                }
                calculate();
              }
            })
            .catch(function(err) {
              if (syncBadge) {
                syncBadge.innerText = '최근 시장 종가 기준 세팅 완료 (직접 편집 가능)';
              }
            });
        }

        target.querySelectorAll('.btn-refresh-prices').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            loadLatestPrices();
          });
        });

        calculate();
        loadLatestPrices();
      });
    };

    // 추가 자동 감지 및 마운트 보증 리스너 (Docsify lifecycle 외 추가 안전장치)
    window.addEventListener('DOMContentLoaded', function() {
      if (window.mountWealthCalculators) window.mountWealthCalculators();
    });
    window.addEventListener('hashchange', function() {
      setTimeout(function() {
        if (window.mountWealthCalculators) window.mountWealthCalculators();
      }, 100);
    });
    if (typeof MutationObserver !== 'undefined') {
      var _mountObserver = new MutationObserver(function() {
        if (document.querySelector('.wealth-rebalance-calc-mount:not([data-mounted="true"])')) {
          if (window.mountWealthCalculators) window.mountWealthCalculators();
        }
      });
      _mountObserver.observe(document.documentElement, { childList: true, subtree: true });
    }
  </script>
